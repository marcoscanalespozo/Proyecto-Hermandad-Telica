<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro | Hermandad Santiago Apóstol de Telica</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/styles.css" rel="stylesheet"></head>
<body class="auth-page"><div class="topline"></div><main class="auth-wrap"><a href="index.html" class="back-home">← Volver al sitio</a><section class="auth-card"><img class="auth-logo" src="assets/img/logo-hermandad.jpg" alt="Logotipo original de la hermandad"><h1>Crear una cuenta</h1><p>Únete a nuestra comunidad y mantente informado.</p><form id="registerForm"><label for="fullName" class="form-label">Nombre completo</label><input class="form-control mb-3" id="fullName" type="text" placeholder="Tu nombre" required><label for="regEmail" class="form-label">Correo electrónico</label><input class="form-control mb-3" id="regEmail" type="email" placeholder="nombre@correo.com" required><label for="regPassword" class="form-label">Contraseña</label><input class="form-control mb-3" id="regPassword" type="password" minlength="8" placeholder="Mínimo 8 caracteres" required><label for="confirmPassword" class="form-label">Confirmar contraseña</label><input class="form-control mb-3" id="confirmPassword" type="password" minlength="8" placeholder="Repite la contraseña" required><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="subscribe" checked><label class="form-check-label" for="subscribe">Deseo recibir avisos dentro de la página.</label></div><button class="btn btn-navy w-100" type="submit">Crear cuenta</button><div class="form-message" id="registerMessage" role="status"></div></form><p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p><small class="muted-small">Prototipo visual: los datos no se envían ni se guardan.</small></section></main><script src="assets/js/main.js"></script></body></html>
